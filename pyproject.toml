[tool.poetry]
name = "proxmoxer-stubs"
version = "0.4.0"
description = "stub files and type containers for proxmoxer"
authors = ["credativ GmbH"]
packages = [
    { include = "proxmoxer-stubs" },
    { include = "proxmoxer_types" },
]
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/credativ/proxmoxer-stubs"
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]


[tool.poetry.urls]
"Bug Tracker" = "https://github.com/credativ/proxmoxer-stubs/issues"

[tool.poetry.dependencies]
python = ">= 3.11"

[tool.poetry.group.dev.dependencies]
proxmoxer = "^2.3.0"
requests = "^2.34.2"
types-requests = "^2.33.0.20260518"
mypy = "^2.1.0"
pytest = "^9.1.1"
pytest-mypy = "^1.0.1"
pydantic = "^2.13.4"
jinja2 = "^3.1.6"
paramiko = "^5.0.0"
openssh-wrapper = "^0.4"
pyright = "^1.1.411"
black = "^26.5.1"
isort = "^8.0.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
strict = "True"

[tool.pytest]
addopts = [
    "proxmoxer-stubs",
    "proxmoxer_types",
    "stubgen",
    "tests",
]

[tool.pyright]
exclude = ["src"]
reportUnnecessaryTypeIgnoreComment = "error"

# The generated code carries "# type: ignore[operator, unused-ignore]" on every
# API call, which mypy needs and pyright considers unnecessary.
[[tool.pyright.executionEnvironments]]
root = "proxmoxer_types"
reportUnnecessaryTypeIgnoreComment = "none"
